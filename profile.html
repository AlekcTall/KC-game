<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль | KC Games</title>
    
    <!-- Стили -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/profile.css">
    
    <!-- Иконки -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-theme">

    <!-- Навигация -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">KC Games</a>
            <div class="nav-links">
                <a href="index.html">Главная</a>
                <a href="games.html">Игры</a>
                <a href="shop.html">Магазин</a>
                <a href="profile.html" class="active">Профиль</a>
                <a href="leaderboard.html">Рейтинг</a>
            </div>
            <div class="user-info">
                <span id="nav-balance" class="balance-badge">0 💰</span>
                <span id="nav-points" class="points-badge">0 XP</span>
                <button id="logout-btn" class="btn-logout"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="container profile-container">
        
        <!-- Заголовок профиля -->
        <header class="profile-header">
            <div class="avatar-section">
                <div id="profile-avatar" class="avatar-large">👤</div>
                <button id="edit-avatar-btn" class="btn-icon"><i class="fas fa-camera"></i></button>
            </div>
            <div class="info-section">
                <h1 id="profile-username">Загрузка...</h1>
                <p id="profile-email" class="text-muted">email@example.com</p>
                <div class="stats-row">
                    <span class="stat-badge"><i class="fas fa-trophy"></i> <span id="profile-points">0</span> XP</span>
                    <span class="stat-badge"><i class="fas fa-coins"></i> <span id="profile-lokoins">0</span> 💰</span>
                    <span class="stat-badge"><i class="fas fa-star"></i> Ранг: <span id="profile-rank">-</span></span>
                </div>
                <p id="profile-department" class="department-badge">Отдел: Не указан</p>
                <p id="profile-description" class="profile-desc">О себе...</p>
            </div>
        </header>

        <!-- Вкладки -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="achievements">Достижения</button>
            <button class="tab-btn" data-tab="inventory">Инвентарь</button>
            <button class="tab-btn" data-tab="history">История</button>
        </div>

        <!-- Контент вкладок -->
        <div class="tab-content">
            
            <!-- Достижения -->
            <div id="tab-achievements" class="tab-pane active">
                <h2><i class="fas fa-medal"></i> Мои достижения</h2>
                <div id="achievements-grid" class="items-grid">
                    <p class="loading-text">Загрузка достижений...</p>
                </div>
            </div>

            <!-- Инвентарь -->
            <div id="tab-inventory" class="tab-pane">
                <h2><i class="fas fa-box-open"></i> Инвентарь</h2>
                <div id="inventory-grid" class="items-grid">
                    <p class="loading-text">Инвентарь пуст</p>
                </div>
            </div>

            <!-- История -->
            <div id="tab-history" class="tab-pane">
                <h2><i class="fas fa-history"></i> История покупок</h2>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Товар</th>
                            <th>Дата</th>
                            <th>Статус</th>
                            <th>Цена</th>
                        </tr>
                    </thead>
                    <tbody id="purchase-history-body">
                        <tr><td colspan="4" class="loading-text">Загрузка истории...</td></tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <!-- Скрипты -->
    <!-- 1. Firebase (только Auth) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <!-- 2. Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>

    <!-- 3. Логика профиля -->
    <script src="js/profile.js"></script>
    
    <!-- 4. Общая логика (Auth UI) -->
    <script src="js/auth.js"></script>

</body>
</html>
