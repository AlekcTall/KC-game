<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админка: Магазин</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/admin.css">
</head>
<body class="dark-theme">
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">KC Admin</a>
            <div class="nav-links">
                <a href="admin-users.html">Пользователи</a>
                <a href="admin-shop.html" class="active">Магазин</a>
                <a href="admin-content.html">Контент</a>
                <a href="index.html">На сайт</a>
            </div>
        </div>
    </nav>

    <main class="container admin-container">
        <h1>🛒 Управление магазином</h1>
        
        <button class="btn-primary" onclick="openAddModal()">+ Добавить товар</button>
        
        <div class="table-wrapper">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Цена</th>
                        <th>Категория</th>
                        <th>Тип эффекта</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="shop-table-body">
                    <tr><td colspan="6" class="loading">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Модалка добавления/редактирования -->
    <div id="item-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modal-title">Товар</h2>
            <input type="hidden" id="item-id">
            <input type="text" id="item-name" placeholder="Название" class="form-input">
            <input type="number" id="item-price" placeholder="Цена" class="form-input">
            <select id="item-category" class="form-input">
                <option value="effect">Эффект</option>
                <option value="avatar">Аватар</option>
                <option value="currency">Валюта</option>
                <option value="background">Фон</option>
                <option value="service">Услуга</option>
            </select>
            <input type="text" id="item-effect-type" placeholder="Тип эффекта (например double_xp)" class="form-input">
            <input type="text" id="item-icon" placeholder="Иконка (эмодзи)" class="form-input">
            <textarea id="item-desc" placeholder="Описание" class="form-input"></textarea>
            <button id="save-item-btn" class="btn-success">Сохранить</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>

    <script>
        async function checkAdmin() {
            const user = firebase.auth().currentUser;
            if (!user) { window.location.href = 'index.html'; return; }
            const { data } = await supabase.from('users').select('data').eq('id', user.uid).single();
            if (data?.data?.role !== 'admin') { alert('Доступ запрещен!'); window.location.href = 'index.html'; }
            else { loadShopItems(); }
        }

        async function loadShopItems() {
            const tbody = document.getElementById('shop-table-body');
            const { data, error } = await supabase.from('shop_items').select('*').order('price');
            if (error) { tbody.innerHTML = '<tr><td colspan="6">Ошибка</td></tr>'; return; }
            
            tbody.innerHTML = data.map(item => `
                <tr>
                    <td class="small-text">${item.id.substring(0,8)}...</td>
                    <td>${item.name} ${item.icon || ''}</td>
                    <td>${item.price}</td>
                    <td>${item.category}</td>
                    <td>${item.effect_type || '-'}</td>
                    <td>
                        <button class="btn-sm btn-danger" onclick="deleteItem('${item.id}')">🗑️</button>
                        <button class="btn-sm btn-edit" onclick='openEditModal(${JSON.stringify(item)})'>✏️</button>
                    </td>
                </tr>
            `).join('');
        }

        window.deleteItem = async (id) => {
            if(!confirm('Удалить товар?')) return;
            await supabase.from('shop_items').delete().eq('id', id);
            loadShopItems();
        };

        window.openAddModal = () => {
            document.getElementById('item-id').value = '';
            document.getElementById('item-name').value = '';
            document.getElementById('item-price').value = '';
            document.getElementById('item-modal').style.display = 'block';
        };

        window.openEditModal = (item) => {
            document.getElementById('item-id').value = item.id;
            document.getElementById('item-name').value = item.name;
            document.getElementById('item-price').value = item.price;
            document.getElementById('item-category').value = item.category;
            document.getElementById('item-effect-type').value = item.effect_type || '';
            document.getElementById('item-icon').value = item.icon || '';
            document.getElementById('item-desc').value = item.description || '';
            document.getElementById('item-modal').style.display = 'block';
        };

        document.querySelector('.close-modal').onclick = () => document.getElementById('item-modal').style.display = 'none';

        document.getElementById('save-item-btn').onclick = async () => {
            const id = document.getElementById('item-id').value || crypto.randomUUID();
            const item = {
                id: id,
                name: document.getElementById('item-name').value,
                price: parseInt(document.getElementById('item-price').value),
                category: document.getElementById('item-category').value,
                effect_type: document.getElementById('item-effect-type').value,
                icon: document.getElementById('item-icon').value,
                description: document.getElementById('item-desc').value,
                data: {} 
            };

            const { error } = document.getElementById('item-id').value 
                ? await supabase.from('shop_items').update(item).eq('id', id)
                : await supabase.from('shop_items').insert([item]);

            if(error) alert('Ошибка: ' + error.message);
            else {
                document.getElementById('item-modal').style.display = 'none';
                loadShopItems();
            }
        };

        checkAdmin();
    </script>
</body>
</html>
