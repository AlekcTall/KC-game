<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пользователи – Админ-панель – Геймификация КЦ</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-page { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
    .back-link { display: inline-block; margin-bottom: 1rem; color: var(--color-primary); text-decoration: none; }
    .admin-users-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .admin-users-table th, .admin-users-table td { padding: 0.5rem; border-bottom: 1px solid #eee; text-align: left; }
    .admin-users-table th { background: #f9f9f9; font-weight: 600; }
    .btn-small { padding: 0.25rem 0.5rem; font-size: 0.8rem; margin: 0 0.1rem; }
    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }
    .badge-admin { background: #e74c3c; color: white; }
    .badge-moderator { background: #f39c12; color: white; }
    .badge-user { background: #3498db; color: white; }
    .skeleton-row td { padding: 0.5rem; }
    .skeleton-cell { height: 1rem; background: #e0e0e0; border-radius: 4px; animation: shimmer 1.5s infinite; }
    @keyframes shimmer { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    .modal { max-width: 450px; }
    .modal .form-group { margin-bottom: 1rem; }
    .modal .form-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.3rem; }
    .modal .form-group input, .modal .form-group select { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px; }
    .small-text { font-size: 0.8rem; color: #888; }
    .admin-filters { display: flex; gap: 1rem; margin-bottom: 1rem; align-items: center; }
    .search-input { flex: 1; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; }
    @media (max-width: 768px) {
      .admin-users-table { font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">КЦ-Игры</a>
      <button class="burger" id="burger-btn" aria-label="Меню">☰</button>
      <nav class="nav" id="main-nav">
        <ul class="nav__list">
          <li><a href="index.html" class="nav__link">Главная</a></li>
          <li><a href="games.html" class="nav__link">Игры</a></li>
          <li><a href="leaderboard.html" class="nav__link">Рейтинг</a></li>
          <li><a href="shop.html" class="nav__link">Магазин</a></li>
          <li><a href="profile.html" class="nav__link">Профиль</a></li>
          <li><a href="admin.html" class="nav__link active">Админ</a></li>
        </ul>
      </nav>
      <div id="auth-status" class="auth-status"></div>
    </div>
  </header>

  <main class="main">
    <div class="container admin-page" id="admin-container">
      <p>Загрузка...</p>
    </div>
  </main>

  <!-- Модальное окно редактирования пользователя -->
  <div class="modal-overlay" id="edit-modal" style="display:none;">
    <div class="modal" style="max-width:450px;">
      <span class="modal-close" id="edit-modal-close">&times;</span>
      <h3>Редактирование пользователя</h3>
      <input type="hidden" id="edit-user-id">
      <div class="form-group">
        <label>Имя</label>
        <input type="text" id="edit-username">
      </div>
      <div class="form-group">
        <label>Баланс Локоинов:</label>
        <input type="number" id="edit-balance">
      </div>
      <div class="form-group">
        <label>Очки Опыта:</label>
        <input type="number" id="edit-points">
      </div>
      <div class="form-group">
        <label>Роль:</label>
        <select id="edit-role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
          <option value="moderator">Moderator</option>
        </select>
      </div>
      <div class="form-group">
        <label><input type="checkbox" id="edit-disabled"> Заблокирован</label>
      </div>
      <button class="btn" id="save-user-btn">Сохранить</button>
      <p id="edit-message" class="auth-message"></p>
    </div>
  </div>

  <!-- Модальное окно подарка -->
  <div class="modal-overlay" id="gift-modal" style="display:none;">
    <div class="modal" style="max-width:400px;">
      <span class="modal-close" id="gift-modal-close">&times;</span>
      <h3>Подарить товар</h3>
      <p id="gift-user-name"></p>
      <div class="form-group">
        <label for="gift-item-select">Товар</label>
        <select id="gift-item-select"></select>
      </div>
      <button class="btn" id="gift-submit">Подарить</button>
      <p id="gift-message" class="auth-message"></p>
    </div>
  </div>

  <!-- Модальное окно выдачи награды -->
  <div class="modal-overlay" id="award-modal" style="display:none;">
    <div class="modal" style="max-width:450px;">
      <span class="modal-close" id="award-modal-close">&times;</span>
      <h3>Выдать награду</h3>
      <p id="award-user-name"></p>
      <div class="form-group">
        <label for="award-select">Награда</label>
        <select id="award-select"></select>
      </div>
      <div class="form-group">
        <label for="award-comment">Комментарий</label>
        <textarea id="award-comment" rows="2"></textarea>
      </div>
      <button class="btn" id="award-submit">Выдать</button>
      <p id="award-message" class="auth-message"></p>
    </div>
  </div>

  <footer class="footer"><div class="container"><p>© 2026 ваши амбассадоры</p></div></footer>

  <!-- Supabase SDK и модули -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/easter-eggs.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/main.js"></script>
  <script src="js/feedback.js"></script>

  <script>
    (function() {
      const CACHE_KEY = 'krugames_admin_users';
      const CACHE_TTL = 2 * 60 * 1000;
      let allUsers = [];

      function getCachedUsers() {
        const cached = sessionStorage.getItem(CACHE_KEY);
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            if (Date.now() - parsed.timestamp < CACHE_TTL) return parsed.data;
          } catch (e) {}
        }
        return null;
      }

      function setCachedUsers(users) {
        sessionStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data: users }));
      }

      // Загрузка списков товаров и наград для модалок
      let shopItems = [];
      let awardsList = [];

      async function loadShopItemsForGift() {
        if (shopItems.length > 0) return;
        const { data, error } = await supabase.from('shop_items').select('id, name, price, icon');
        if (!error) shopItems = data || [];
      }

      async function loadAwards() {
        if (awardsList.length > 0) return;
        const { data, error } = await supabase.from('awards').select('id, name, lokoin_reward, icon');
        if (!error) awardsList = data || [];
      }

      document.addEventListener('DOMContentLoaded', async () => {
        const container = document.getElementById('admin-container');

        if (typeof onAuthStateChange === 'function') {
          onAuthStateChange(async (event, session) => {
            if (!session?.user) {
              container.innerHTML = '<p>Вы не авторизованы.</p>';
              return;
            }
            try {
              const { data: row, error } = await supabase
                .from('users')
                .select('data')
                .eq('id', session.user.id)
                .single();

              if (error || !row || (row.data?.role !== 'admin')) {
                container.innerHTML = '<p>Доступ запрещён.</p>';
                return;
              }

              renderPage();
              loadUsers();
              loadShopItemsForGift();
              loadAwards();
            } catch (e) {
              container.innerHTML = `<p>Ошибка: ${e.message}</p>`;
            }
          });
        } else {
          container.innerHTML = '<p>Ошибка загрузки системы авторизации.</p>';
        }

        function renderPage() {
          container.innerHTML = `
            <a href="admin.html" class="back-link">← В админку</a>
            <h2>👥 Управление пользователями</h2>
            <div class="admin-filters">
              <input type="text" id="search-user" placeholder="Поиск по имени или email..." class="search-input">
              <button class="btn" id="reload-users-btn">Обновить</button>
            </div>
            <table class="admin-users-table">
              <thead>
                <tr>
                  <th>UID</th>
                  <th>Имя</th>
                  <th>Email</th>
                  <th>Баланс 💰</th>
                  <th>Очки ⭐</th>
                  <th>Роль</th>
                  <th>Статус</th>
                  <th>Действия</th>
                </tr>
              </thead>
              <tbody id="users-tbody"></tbody>
            </table>
          `;

          document.getElementById('reload-users-btn').addEventListener('click', loadUsers);
          document.getElementById('search-user').addEventListener('input', filterUsers);

          // Закрытие модалок
          document.getElementById('edit-modal-close').addEventListener('click', () => {
            document.getElementById('edit-modal').style.display = 'none';
          });
          document.getElementById('gift-modal-close').addEventListener('click', () => {
            document.getElementById('gift-modal').style.display = 'none';
          });
          document.getElementById('award-modal-close').addEventListener('click', () => {
            document.getElementById('award-modal').style.display = 'none';
          });
          window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('edit-modal')) {
              document.getElementById('edit-modal').style.display = 'none';
            }
            if (e.target === document.getElementById('gift-modal')) {
              document.getElementById('gift-modal').style.display = 'none';
            }
            if (e.target === document.getElementById('award-modal')) {
              document.getElementById('award-modal').style.display = 'none';
            }
          });

          // Сохранение редактирования
          document.getElementById('save-user-btn').addEventListener('click', async () => {
            const id = document.getElementById('edit-user-id').value;
            const username = document.getElementById('edit-username').value.trim();
            const balance = parseInt(document.getElementById('edit-balance').value, 10);
            const points = parseInt(document.getElementById('edit-points').value, 10);
            const role = document.getElementById('edit-role').value;
            const disabled = document.getElementById('edit-disabled').checked;
            const msgEl = document.getElementById('edit-message');
            const btn = document.getElementById('save-user-btn');

            if (isNaN(balance) || isNaN(points)) {
              msgEl.textContent = 'Введите числовые значения.';
              return;
            }

            btn.disabled = true;
            btn.textContent = 'Сохранение...';

            try {
              const { data: currentRow, error: fetchError } = await supabase
                .from('users')
                .select('data')
                .eq('id', id)
                .single();
              if (fetchError) throw fetchError;

              const currentData = currentRow.data || {};
              const updatedData = {
                ...currentData,
                username,
                lokoin_balance: balance,
                points: points,
                role: role,
                disabled: disabled
              };

              const { error: updateError } = await supabase
                .from('users')
                .update({ data: updatedData, updated_at: new Date().toISOString() })
                .eq('id', id);
              if (updateError) throw updateError;

              msgEl.textContent = 'Сохранено!';
              msgEl.className = 'auth-message success';
              setTimeout(() => {
                document.getElementById('edit-modal').style.display = 'none';
              }, 1000);
              loadUsers();
            } catch (err) {
              msgEl.textContent = 'Ошибка: ' + err.message;
              msgEl.className = 'auth-message error';
            } finally {
              btn.disabled = false;
              btn.textContent = 'Сохранить';
            }
          });

          // Подарок товара
          document.getElementById('gift-submit').addEventListener('click', async () => {
            const select = document.getElementById('gift-item-select');
            const itemId = select.value;
            if (!itemId) {
              document.getElementById('gift-message').textContent = 'Выберите товар.';
              return;
            }
            const userId = document.getElementById('gift-modal').dataset.userId;
            if (!userId) return;

            const item = shopItems.find(i => i.id === itemId);
            try {
              const { data: userRow } = await supabase.from('users').select('data').eq('id', userId).single();
              const userData = userRow.data || {};
              const purchased = Array.isArray(userData.purchasedItems) ? userData.purchasedItems : [];
              if (!purchased.includes(item.id)) purchased.push(item.id);
              const newData = { ...userData, purchasedItems: purchased };
              await supabase.from('users').update({ data: newData, updated_at: new Date().toISOString() }).eq('id', userId);

              // Уведомление
              if (typeof addNotification === 'function') {
                await addNotification(userId, `🎁 Вам подарен товар: ${item.name}`, 'gift', 'shop.html');
              }

              document.getElementById('gift-message').textContent = 'Товар подарен!';
              document.getElementById('gift-message').className = 'auth-message success';
              setTimeout(() => { document.getElementById('gift-modal').style.display = 'none'; }, 1500);
              loadUsers();
            } catch (err) {
              document.getElementById('gift-message').textContent = 'Ошибка: ' + err.message;
            }
          });

          // Выдача награды
          document.getElementById('award-submit').addEventListener('click', async () => {
            const select = document.getElementById('award-select');
            const awardId = select.value;
            const comment = document.getElementById('award-comment').value.trim();
            if (!awardId) {
              document.getElementById('award-message').textContent = 'Выберите награду.';
              return;
            }
            const userId = document.getElementById('award-modal').dataset.userId;
            if (!userId) return;

            const award = awardsList.find(a => a.id === awardId);
            try {
              // Запись в user_awarded
              const { data: { user } } = await supabase.auth.getUser();
              await supabase.from('user_awarded').insert([{
                user_id: userId,
                award_id: awardId,
                awarded_at: new Date().toISOString(),
                comment,
                given_by: user?.id
              }]);

              // Начисление локоинов
              if (award.lokoin_reward > 0) {
                const { data: userRow } = await supabase.from('users').select('data').eq('id', userId).single();
                const userData = userRow.data || {};
                const newBalance = (userData.lokoin_balance || 0) + award.lokoin_reward;
                const newData = { ...userData, lokoin_balance: newBalance };
                await supabase.from('users').update({ data: newData, updated_at: new Date().toISOString() }).eq('id', userId);
              }

              // Уведомление
              let msg = `Вы получили награду «${award.name}»!`;
              if (comment) msg += ` Комментарий: ${comment}`;
              if (award.lokoin_reward > 0) msg += ` (+${award.lokoin_reward} лок.)`;
              if (typeof addNotification === 'function') {
                await addNotification(userId, msg, 'award', 'profile.html');
              }

              document.getElementById('award-message').textContent = 'Награда выдана!';
              document.getElementById('award-message').className = 'auth-message success';
              setTimeout(() => { document.getElementById('award-modal').style.display = 'none'; }, 1500);
              loadUsers();
            } catch (err) {
              document.getElementById('award-message').textContent = 'Ошибка: ' + err.message;
            }
          });
        }

        async function loadUsers() {
          const tbody = document.getElementById('users-tbody');
          if (!tbody) return;

          tbody.innerHTML = Array.from({ length: 8 }, () => `
            <tr class="skeleton-row">
              <td><div class="skeleton-cell" style="width:80px;"></div></td>
              <td><div class="skeleton-cell" style="width:120px;"></div></td>
              <td><div class="skeleton-cell" style="width:180px;"></div></td>
              <td><div class="skeleton-cell" style="width:60px;"></div></td>
              <td><div class="skeleton-cell" style="width:60px;"></div></td>
              <td><div class="skeleton-cell" style="width:60px;"></div></td>
              <td><div class="skeleton-cell" style="width:60px;"></div></td>
              <td><div class="skeleton-cell" style="width:100px;"></div></td>
            </tr>
          `).join('');

          try {
            const { data, error } = await supabase
              .from('users')
              .select('id, email, data')
              .order('created_at', { ascending: false });

            if (error) throw error;

            allUsers = data || [];
            setCachedUsers(allUsers);
            renderUsersTable(allUsers);
          } catch (e) {
            console.error(e);
            tbody.innerHTML = '<tr><td colspan="8" class="error-message">Ошибка загрузки</td></tr>';
          }
        }

        function filterUsers() {
          const query = document.getElementById('search-user').value.trim().toLowerCase();
          let filtered = allUsers;
          if (query) {
            filtered = allUsers.filter(u => {
              const d = u.data || {};
              return (d.username || '').toLowerCase().includes(query) ||
                     (u.email || '').toLowerCase().includes(query);
            });
          }
          renderUsersTable(filtered);
        }

        function renderUsersTable(users) {
          const tbody = document.getElementById('users-tbody');
          if (!tbody) return;

          if (!users.length) {
            tbody.innerHTML = '<tr><td colspan="8">Пользователей нет</td></tr>';
            return;
          }

          tbody.innerHTML = users.map(u => {
            const d = u.data || {};
            const roleClass = d.role === 'admin' ? 'badge-admin' : (d.role === 'moderator' ? 'badge-moderator' : 'badge-user');
            const status = d.disabled ? '🔒' : '✅';
            return `
              <tr>
                <td class="small-text" title="${u.id}">${u.id.substring(0, 8)}...</td>
                <td>${d.username || '-'}</td>
                <td>${u.email || '-'}</td>
                <td>${d.lokoin_balance || 0}</td>
                <td>${d.points || 0}</td>
                <td><span class="badge ${roleClass}">${d.role || 'user'}</span></td>
                <td>${status}</td>
                <td>
                  <button class="btn btn-small edit-user-btn" data-uid="${u.id}" data-username="${d.username || ''}" data-balance="${d.lokoin_balance || 0}" data-points="${d.points || 0}" data-role="${d.role || 'user'}" data-disabled="${d.disabled || false}">✏️</button>
                  <button class="btn btn-small toggle-block-btn" data-uid="${u.id}" data-disabled="${d.disabled || false}">${d.disabled ? '🔓' : '🔒'}</button>
                  <button class="btn btn-small gift-btn" data-uid="${u.id}" data-username="${d.username || ''}">🎁</button>
                  <button class="btn btn-small award-btn" data-uid="${u.id}" data-username="${d.username || ''}">🎖️</button>
                </td>
              </tr>
            `;
          }).join('');

          // Обработчики
          document.querySelectorAll('.edit-user-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              openEditModal(btn.dataset.uid, btn.dataset.username, btn.dataset.balance, btn.dataset.points, btn.dataset.role, btn.dataset.disabled === 'true');
            });
          });

          document.querySelectorAll('.toggle-block-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
              const uid = btn.dataset.uid;
              const currentDisabled = btn.dataset.disabled === 'true';
              const newDisabled = !currentDisabled;
              if (confirm(`Вы уверены, что хотите ${newDisabled ? 'заблокировать' : 'разблокировать'} пользователя?`)) {
                const { data: currentRow } = await supabase.from('users').select('data').eq('id', uid).single();
                const newData = { ...(currentRow?.data || {}), disabled: newDisabled };
                await supabase.from('users').update({ data: newData, updated_at: new Date().toISOString() }).eq('id', uid);
                showToast(newDisabled ? 'Пользователь заблокирован' : 'Пользователь разблокирован', 'success');
                loadUsers();
              }
            });
          });

          document.querySelectorAll('.gift-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              openGiftModal(btn.dataset.uid, btn.dataset.username);
            });
          });

          document.querySelectorAll('.award-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              openAwardModal(btn.dataset.uid, btn.dataset.username);
            });
          });
        }

        function openEditModal(id, username, balance, points, role, disabled) {
          document.getElementById('edit-user-id').value = id;
          document.getElementById('edit-username').value = username;
          document.getElementById('edit-balance').value = balance;
          document.getElementById('edit-points').value = points;
          document.getElementById('edit-role').value = role;
          document.getElementById('edit-disabled').checked = disabled;
          document.getElementById('edit-message').textContent = '';
          document.getElementById('edit-modal').style.display = 'flex';
        }

        function openGiftModal(userId, username) {
          document.getElementById('gift-user-name').textContent = `Пользователь: ${username}`;
          document.getElementById('gift-message').textContent = '';
          const select = document.getElementById('gift-item-select');
          select.innerHTML = shopItems.map(item => `<option value="${item.id}">${item.icon || '🛒'} ${item.name} (${item.price} лок.)</option>`).join('');
          document.getElementById('gift-modal').dataset.userId = userId;
          document.getElementById('gift-modal').style.display = 'flex';
        }

        function openAwardModal(userId, username) {
          document.getElementById('award-user-name').textContent = `Пользователь: ${username}`;
          document.getElementById('award-message').textContent = '';
          const select = document.getElementById('award-select');
          select.innerHTML = awardsList.map(a => `<option value="${a.id}">${a.name} ${a.lokoin_reward > 0 ? `(+${a.lokoin_reward} лок.)` : ''}</option>`).join('');
          document.getElementById('award-modal').dataset.userId = userId;
          document.getElementById('award-modal').style.display = 'flex';
        }
      });
    })();
  </script>
</body>
</html>
