<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админка: Пользователи</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/admin.css">
</head>
<body class="dark-theme">
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">KC Admin</a>
            <div class="nav-links">
                <a href="admin-users.html" class="active">Пользователи</a>
                <a href="admin-shop.html">Магазин</a>
                <a href="admin-content.html">Контент</a>
                <a href="index.html">На сайт</a>
            </div>
        </div>
    </nav>

    <main class="container admin-container">
        <h1>👥 Управление пользователями</h1>
        
        <div class="admin-filters">
            <input type="text" id="search-user" placeholder="Поиск по имени или email..." class="search-input">
            <button id="load-users-btn" class="btn-primary">Обновить список</button>
        </div>

        <div class="table-wrapper">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID (UID)</th>
                        <th>Имя</th>
                        <th>Email</th>
                        <th>Баланс (💰)</th>
                        <th>Очки (XP)</th>
                        <th>Роль</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="users-table-body">
                    <tr><td colspan="7" class="loading">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Модальное окно редактирования -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Редактирование пользователя</h2>
            <input type="hidden" id="edit-user-id">
            <div class="form-group">
                <label>Баланс Локоинов:</label>
                <input type="number" id="edit-balance">
            </div>
            <div class="form-group">
                <label>Очки Опыта:</label>
                <input type="number" id="edit-points">
            </div>
            <div class="form-group">
                <label>Роль:</label>
                <select id="edit-role">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                    <option value="moderator">Moderator</option>
                </select>
            </div>
            <button id="save-user-btn" class="btn-success">Сохранить</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // Проверка прав админа
        async function checkAdmin() {
            const user = firebase.auth().currentUser;
            if (!user) { window.location.href = 'index.html'; return; }
            
            const { data } = await supabase.from('users').select('data').eq('id', user.uid).single();
            if (data?.data?.role !== 'admin') {
                alert('Доступ запрещен!');
                window.location.href = 'index.html';
            } else {
                loadUsers();
            }
        }

        // Загрузка пользователей
        async function loadUsers() {
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '<tr><td colspan="7" class="loading">Загрузка...</td></tr>';

            try {
                // Читаем только нужные поля для скорости
                const { data, error } = await supabase
                    .from('users')
                    .select('id, email, data')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7">Пользователей нет</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(u => {
                    const d = u.data || {};
                    return `
                        <tr>
                            <td class="small-text">${u.id.substring(0,8)}...</td>
                            <td>${d.username || '-'}</td>
                            <td>${u.email || '-'}</td>
                            <td>${d.lokoin_balance || 0}</td>
                            <td>${d.points || 0}</td>
                            <td><span class="badge ${d.role}">${d.role || 'user'}</span></td>
                            <td>
                                <button class="btn-sm btn-edit" onclick="openEditModal('${u.id}', ${d.lokoin_balance||0}, ${d.points||0}, '${d.role||'user'}')">✏️</button>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="7" class="error">Ошибка загрузки</td></tr>';
            }
        }

        // Модальное окно
        window.openEditModal = (id, balance, points, role) => {
            document.getElementById('edit-user-id').value = id;
            document.getElementById('edit-balance').value = balance;
            document.getElementById('edit-points').value = points;
            document.getElementById('edit-role').value = role;
            document.getElementById('edit-modal').style.display = 'block';
        };

        document.querySelector('.close-modal').onclick = () => {
            document.getElementById('edit-modal').style.display = 'none';
        };

        // Сохранение
        document.getElementById('save-user-btn').onclick = async () => {
            const id = document.getElementById('edit-user-id').value;
            const balance = parseInt(document.getElementById('edit-balance').value);
            const points = parseInt(document.getElementById('edit-points').value);
            const role = document.getElementById('edit-role').value;

            const btn = document.getElementById('save-user-btn');
            btn.disabled = true;
            btn.textContent = 'Сохранение...';

            try {
                // Получаем текущий data, чтобы не затереть остальное
                const { data: currentUser } = await supabase.from('users').select('data').eq('id', id).single();
                const currentData = currentUser.data || {};
                
                const updatedData = {
                    ...currentData,
                    lokoin_balance: balance,
                    points: points,
                    role: role
                };

                const { error } = await supabase
                    .from('users')
                    .update({ data: updatedData })
                    .eq('id', id);

                if (error) throw error;
                
                alert('Сохранено!');
                document.getElementById('edit-modal').style.display = 'none';
                loadUsers();

            } catch (err) {
                alert('Ошибка: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Сохранить';
            }
        };

        // Старт
        checkAdmin();
    </script>
</body>
</html>
