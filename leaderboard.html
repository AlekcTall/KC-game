<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейтинг игроков | KC Games</title>
    
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/leaderboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-theme">

    <!-- Навигация -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">KC Games</a>
            <div class="nav-links">
                <a href="index.html">Главная</a>
                <a href="games.html">Игры</a>
                <a href="shop.html">Магазин</a>
                <a href="profile.html">Профиль</a>
                <a href="leaderboard.html" class="active">Рейтинг</a>
            </div>
            <div class="user-info">
                <span id="nav-balance" class="balance-badge">0 💰</span>
                <span id="nav-points" class="points-badge">0 XP</span>
            </div>
        </div>
    </nav>

    <main class="container leaderboard-container">
        <header class="page-header">
            <h1><i class="fas fa-trophy"></i> Топ игроков</h1>
            <p>Лучшие игроки недели и все время</p>
        </header>

        <!-- Переключатели режимов -->
        <div class="mode-switcher">
            <button class="mode-btn active" data-mode="global">За все время</button>
            <button class="mode-btn" data-mode="weekly">За неделю</button>
            <button class="mode-btn" data-mode="monthly">За месяц</button>
        </div>

        <!-- Таблица лидеров -->
        <div class="leaderboard-table-wrapper">
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Игрок</th>
                        <th>Отдел</th>
                        <th>Очки опыта</th>
                        <th>Уровень</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr>
                        <td colspan="5" class="loading-row">
                            <i class="fas fa-spinner fa-spin"></i> Загрузка рейтинга...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Блок текущего пользователя -->
        <div id="current-user-rank" class="my-rank-card">
            <!-- Заполняется JS -->
        </div>
    </main>

    <!-- Скрипты -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    
    <script src="js/auth.js"></script>
    <script src="js/leaderboard.js"></script>

</body>
</html>
