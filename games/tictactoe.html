<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-нолики | KC Games</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/games.css">
</head>
<body class="dark-theme">
    <nav class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">KC Games</a>
            <div class="nav-links">
                <a href="../index.html">Главная</a>
                <a href="../games.html">Игры</a>
                <a href="../shop.html">Магазин</a>
                <a href="../profile.html">Профиль</a>
            </div>
        </div>
    </nav>

    <main class="container game-container">
        <h1>Крестики-нолики</h1>
        
        <div id="game-menu" class="game-menu">
            <button id="create-game-btn" class="btn-primary">Создать игру</button>
            <div id="games-list" class="games-list">
                <p>Поиск доступных игр...</p>
            </div>
        </div>

        <div id="game-board" class="game-board" style="display:none;">
            <div class="game-info">
                <span id="game-status">Ожидание соперника...</span>
                <button id="leave-game-btn" class="btn-secondary">Выйти</button>
            </div>
            <div class="board-grid" id="board-grid">
                <!-- Ячейки 3x3 -->
            </div>
        </div>
    </main>

    <!-- Скрипты -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        // === ЛОГИКА ИГРЫ (TicTacToe) ===
        let currentGameId = null;
        let mySymbol = 'X';
        let isMyTurn = false;
        let channel = null;
        let isInitialized = false;

        const boardGrid = document.getElementById('board-grid');
        const gameMenu = document.getElementById('game-menu');
        const gameBoard = document.getElementById('game-board');
        const gamesList = document.getElementById('games-list');
        const statusEl = document.getElementById('game-status');

        document.addEventListener('DOMContentLoaded', () => {
            if (isInitialized) return;
            isInitialized = true;

            const user = firebase.auth().currentUser;
            if (!user) {
                alert('Войдите в аккаунт для игры!');
                window.location.href = '../index.html';
                return;
            }

            document.getElementById('create-game-btn').addEventListener('click', createGame);
            document.getElementById('leave-game-btn').addEventListener('click', leaveGame);
            
            loadAvailableGames();
        });

        // Создание игры
        async function createGame() {
            const user = firebase.auth().currentUser;
            const gameId = 'ttt_' + Date.now();
            
            const newGame = {
                id: gameId,
                status: 'waiting',
                turn: null,
                winner: null,
                created_at: new Date(),
                data: {
                    players: { [user.uid]: { symbol: 'X', joinedAt: new Date() } },
                    board: Array(9).fill(null),
                    creator: user.uid
                }
            };

            const { error } = await supabase.from('tictactoe_games').insert([newGame]);
            if (error) {
                alert('Ошибка создания игры: ' + error.message);
                return;
            }

            joinGame(gameId, user.uid);
        }

        // Загрузка списка игр
        async function loadAvailableGames() {
            const { data, error } = await supabase
                .from('tictactoe_games')
                .select('*')
                .eq('status', 'waiting')
                .limit(5);
            
            if (error) return;

            if (data.length === 0) {
                gamesList.innerHTML = '<p>Нет активных игр. Создайте свою!</p>';
            } else {
                gamesList.innerHTML = data.map(g => `
                    <div class="game-item">
                        <span>Игра #${g.id.slice(-4)}</span>
                        <button onclick="joinGame('${g.id}', '${firebase.auth().currentUser.uid}')" class="btn-small">Присоединиться</button>
                    </div>
                `).join('');
            }
        }

        // Присоединение к игре
        async function joinGame(gameId, userId) {
            currentGameId = gameId;
            
            // Подписка на изменения (Realtime)
            channel = supabase
                .channel(`tictactoe-${gameId}`)
                .on('postgres_changes', 
                    { event: 'UPDATE', schema: 'public', table: 'tictactoe_games', filter: `id=eq.${gameId}` }, 
                    handleGameUpdate
                )
                .subscribe();

            // Если это не создатель, добавляем себя как второго игрока
            const { data: game } = await supabase.from('tictactoe_games').select('*').eq('id', gameId).single();
            const players = game.data.players;
            
            if (Object.keys(players).length === 1 && !players[userId]) {
                players[userId] = { symbol: 'O', joinedAt: new Date() };
                await supabase.from('tictactoe_games')
                    .update({ 
                        status: 'playing', 
                        turn: Object.keys(players)[0], // Ход создателя (X)
                        data: { ...game.data, players } 
                    })
                    .eq('id', gameId);
            }

            mySymbol = players[userId]?.symbol || 'O';
            renderGameUI(game);
        }

        // Обработка обновлений
        function handleGameUpdate(payload) {
            const newGame = payload.new;
            renderGameUI(newGame);
            
            if (newGame.status === 'finished') {
                setTimeout(() => {
                    alert(newGame.winner ? (newGame.winner === firebase.auth().currentUser.uid ? 'Победа!' : 'Поражение!') : 'Ничья!');
                    leaveGame();
                    loadAvailableGames();
                }, 500);
            }
        }

        // Отрисовка поля
        function renderGameUI(game) {
            gameMenu.style.display = 'none';
            gameBoard.style.display = 'block';
            
            const board = game.data.board;
            const isMyTurnNow = game.turn === firebase.auth().currentUser.uid;
            isMyTurn = isMyTurnNow;

            statusEl.textContent = isMyTurnNow ? "Ваш ход!" : "Ход соперника...";
            statusEl.className = isMyTurnNow ? "status-my-turn" : "status-wait";

            boardGrid.innerHTML = board.map((cell, idx) => `
                <div class="cell ${cell ? 'taken' : ''}" onclick="makeMove(${idx})">
                    ${cell ? cell : ''}
                </div>
            `).join('');
        }

        // Ход
        window.makeMove = async (idx) => {
            if (!isMyTurn) return alert("Не ваш ход!");
            
            const { data: game } = await supabase.from('tictactoe_games').select('*').eq('id', currentGameId).single();
            if (game.data.board[idx]) return; // Клетка занята

            const newBoard = [...game.data.board];
            newBoard[idx] = mySymbol;
            
            // Проверка победы
            const winner = checkWinner(newBoard);
            const nextPlayer = Object.keys(game.data.players).find(p => p !== firebase.auth().currentUser.uid);
            
            const updateData = {
                data: { ...game.data, board: newBoard },
                turn: winner ? null : nextPlayer,
                status: winner ? 'finished' : 'playing',
                winner: winner || null
            };

            await supabase.from('tictactoe_games').update(updateData).eq('id', currentGameId);
            
            if (winner) {
                // Начисление награды победителю (через RPC или прямой апдейт users)
                if (winner === firebase.auth().currentUser.uid) {
                    // TODO: Вызов функции начисления
                }
            }
        };

        function checkWinner(board) {
            const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let line of lines) {
                const [a,b,c] = line;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a] === 'X' ? Object.keys(window.gameData?.players || {})[0] : Object.keys(window.gameData?.players || {})[1]; // Упрощено
            }
            return board.includes(null) ? null : 'draw';
        }

        function leaveGame() {
            if (channel) channel.unsubscribe();
            currentGameId = null;
            gameBoard.style.display = 'none';
            gameMenu.style.display = 'block';
            loadAvailableGames();
        }
        
        // Глобальная переменная для хелпера проверки (костыль для checkWinner)
        window.gameData = null;
        function handleGameUpdate(payload) {
             window.gameData = payload.new.data;
             // ... остальной код из выше
             const newGame = payload.new;
             renderGameUI(newGame);
             if (newGame.status === 'finished') {
                 setTimeout(() => {
                    const uid = firebase.auth().currentUser.uid;
                    let msg = 'Ничья!';
                    if (newGame.winner) msg = newGame.winner === uid ? 'Победа!' : 'Поражение!';
                    alert(msg);
                    leaveGame();
                 }, 100);
             }
        }
    </script>
</body>
</html>
