<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Морской Бой | KC Games</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/game.css">
    <style>
        /* Стили для доски (упрощенно) */
        .game-board { display: grid; grid-template-columns: repeat(10, 30px); gap: 2px; margin: 20px auto; max-width: 350px; }
        .cell { width: 30px; height: 30px; background: #3498db; border: 1px solid #2980b9; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .cell.hit { background: #e74c3c; }
        .cell.miss { background: #ecf0f1; }
        .cell.ship { background: #2c3e50; }
        .status-panel { text-align: center; margin: 20px; font-size: 1.2em; font-weight: bold; }
        .btn { padding: 10px 20px; background: #27ae60; color: white; border: none; cursor: pointer; border-radius: 5px; font-size: 16px; }
        .btn:disabled { background: #95a5a6; }
        #game-setup, #game-area { display: none; }
        #game-setup.active, #game-area.active { display: block; }
    </style>
</head>
<body class="dark-theme">

    <nav class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">KC Games</a>
            <div class="nav-links">
                <a href="../index.html">Главная</a>
                <a href="../games.html">Игры</a>
                <a href="../shop.html">Магазин</a>
            </div>
        </div>
    </nav>

    <main class="container game-container">
        <h1>🚢 Морской Бой</h1>
        
        <!-- Экран меню -->
        <div id="game-setup" class="active">
            <p>Сразись с другим игроком онлайн!</p>
            <button id="btn-create-game" class="btn">Создать игру</button>
            <button id="btn-find-game" class="btn">Найти соперника</button>
            <div id="waiting-msg" style="display:none; margin-top:20px;">Поиск игры... <br> <small>Ожидаем соперника...</small></div>
        </div>

        <!-- Экран игры -->
        <div id="game-area">
            <div class="status-panel" id="game-status">Загрузка...</div>
            
            <div class="boards-wrapper" style="display:flex; justify-content:center; gap:40px; flex-wrap:wrap;">
                <!-- Доска соперника (куда стреляем) -->
                <div>
                    <h3>Доска противника</h3>
                    <div id="enemy-board" class="game-board"></div>
                </div>
                
                <!-- Наша доска -->
                <div>
                    <h3>Наш флот</h3>
                    <div id="my-board" class="game-board"></div>
                </div>
            </div>

            <button id="btn-leave" class="btn" style="background:#c0392b; margin-top:20px;">Выйти</button>
        </div>
    </main>

    <!-- Скрипты -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        /**
         * BATTLESHIP GAME LOGIC (Supabase Realtime)
         */
        let currentGameId = null;
        let myUid = null;
        let channel = null;
        let isInitialized = false; // Защита от повторной инициализации

        document.addEventListener('DOMContentLoaded', async () => {
            // Ждем авторизации
            await new Promise(resolve => {
                const unsub = firebase.auth().onAuthStateChanged(user => {
                    if (user) {
                        myUid = user.uid;
                        unsub();
                        resolve();
                    }
                });
                setTimeout(resolve, 2000); // Fallback
            });

            if (!myUid) {
                alert('Сначала войдите в аккаунт!');
                window.location.href = '../index.html';
                return;
            }

            initEventListeners();
        });

        function initEventListeners() {
            document.getElementById('btn-create-game').onclick = createGame;
            document.getElementById('btn-find-game').onclick = findGame;
            document.getElementById('btn-leave').onclick = leaveGame;
        }

        // 1. Создание игры
        async function createGame() {
            const gameId = 'battle_' + Date.now() + '_' + myUid.substring(0,5);
            
            const newGame = {
                id: gameId,
                status: 'waiting', // waiting, playing, finished
                turn: null,
                winner: null,
                created_at: new Date(),
                data: {
                    players: { [myUid]: { ready: false, ships: [] } }, // Ships генерируются позже
                    moves: [],
                    boardSize: 10
                }
            };

            const { error } = await supabase.from('battles').insert([newGame]);
            if (error) {
                alert('Ошибка создания игры: ' + error.message);
                return;
            }

            currentGameId = gameId;
            startGameLoop(gameId);
        }

        // 2. Поиск игры
        async function findGame() {
            document.getElementById('waiting-msg').style.display = 'block';
            
            // Ищем игру со статусом 'waiting'
            const { data, error } = await supabase
                .from('battles')
                .select('*')
                .eq('status', 'waiting')
                .order('created_at', { ascending: true })
                .limit(1)
                .single();

            if (error || !data) {
                alert('Нет доступных игр. Создайте свою!');
                document.getElementById('waiting-msg').style.display = 'none';
                return;
            }

            // Присоединяемся
            const players = data.data.players || {};
            players[myUid] = { ready: false, ships: [] };

            const { error: updateError } = await supabase
                .from('battles')
                .update({ 
                    status: 'playing',
                    turn: Object.keys(players)[0], // Первый игрок ходит
                    data: { ...data.data, players }
                })
                .eq('id', data.id);

            if (updateError) {
                alert('Ошибка присоединения: ' + updateError.message);
                return;
            }

            currentGameId = data.id;
            startGameLoop(data.id);
        }

        // 3. Запуск цикла игры (Realtime)
        function startGameLoop(gameId) {
            if (isInitialized) return;
            isInitialized = true;

            document.getElementById('game-setup').classList.remove('active');
            document.getElementById('game-area').classList.add('active');

            // Подписка на изменения в таблице battles
            channel = supabase
                .channel(`battles:${gameId}`)
                .on(
                    'postgres_changes',
                    {
                        event: '*', // Любое изменение (INSERT, UPDATE, DELETE)
                        schema: 'public',
                        table: 'battles',
                        filter: `id=eq.${gameId}`
                    },
                    handleGameUpdate
                )
                .subscribe(status => {
                    if (status === 'SUBSCRIBED') {
                        console.log('Подключено к игре:', gameId);
                        renderBoards(); // Первичный рендер
                    }
                });
        }

        // 4. Обработка обновлений от сервера
        async function handleGameUpdate(payload) {
            const game = payload.new; // Полное состояние игры
            const gameState = game.data;
            const players = gameState.players || {};
            const myData = players[myUid] || {};

            // Обновление статуса
            const statusEl = document.getElementById('game-status');
            if (game.status === 'waiting') {
                statusEl.textContent = 'Ожидание соперника...';
            } else if (game.status === 'finished') {
                statusEl.textContent = game.winner === myUid ? '🏆 ПОБЕДА!' : '💀 Поражение';
                unsubscribeChannel();
            } else {
                // Ход
                const isMyTurn = game.turn === myUid;
                statusEl.textContent = isMyTurn ? '✅ Ваш ход!' : '⏳ Ход соперника...';
                
                // Отрисовка досок
                renderBoards(gameState);
            }
        }

        // 5. Рендер досок (Упрощенно)
        function renderBoards(gameState) {
            if (!gameState) return;
            const myBoardEl = document.getElementById('my-board');
            const enemyBoardEl = document.getElementById('enemy-board');
            
            // Здесь должна быть логика отрисовки 10x10 клеток
            // Для примера просто заполним заглушками
            if (myBoardEl.children.length === 0) {
                for(let i=0; i<100; i++) {
                    myBoardEl.innerHTML += '<div class="cell ship">🚢</div>'; // Мои корабли
                    enemyBoardEl.innerHTML += '<div class="cell" onclick="makeMove('+i+')"></div>'; // Клетки врага
                }
            }
            // В реальной версии тут нужно парсить gameState.moves и красить клетки в hit/miss
        }

        // 6. Сделать ход
        window.makeMove = async (cellIndex) => {
            if (!currentGameId) return;
            
            // Получаем свежее состояние
            const { data: game } = await supabase.from('battles').select('*').eq('id', currentGameId).single();
            if (game.turn !== myUid) {
                alert('Не ваш ход!');
                return;
            }

            const move = { by: myUid, target: cellIndex, time: Date.now() };
            const newMoves = [...(game.data.moves || []), move];

            // Передаем ход (упрощенно: просто меняем turn на другого UID)
            const otherPlayer = Object.keys(game.data.players).find(uid => uid !== myUid);
            
            await supabase
                .from('battles')
                .update({
                    turn: otherPlayer,
                    data: { ...game.data, moves: newMoves }
                })
                .eq('id', currentGameId);
        };

        function leaveGame() {
            unsubscribeChannel();
            window.location.href = '../games.html';
        }

        function unsubscribeChannel() {
            if (channel) {
                supabase.removeChannel(channel);
                channel = null;
            }
            isInitialized = false;
        }
    </script>
</body>
</html>
