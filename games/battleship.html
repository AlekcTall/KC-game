<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Морской Бой | KC Games</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/games.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Стили для доски (упрощенно) */
        .game-board { display: grid; grid-template-columns: repeat(10, 30px); gap: 2px; margin: 20px auto; max-width: 350px; }
        .cell { width: 30px; height: 30px; background: #a0d2eb; border: 1px solid #555; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .cell.ship { background: #4a90e2; }
        .cell.hit { background: #e74c3c; color: white; }
        .cell.miss { background: #ecf0f1; }
        .cell:hover { opacity: 0.8; }
        .status-bar { text-align: center; font-size: 18px; margin: 10px; font-weight: bold; }
        .btn-game { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #2ecc71; color: white; border: none; border-radius: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body class="dark-theme">

    <nav class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">KC Games</a>
            <div class="nav-links">
                <a href="../index.html">Главная</a>
                <a href="../games.html">Игры</a>
                <a href="battleship.html" class="active">Морской Бой</a>
            </div>
        </div>
    </nav>

    <main class="container game-container">
        <h1><i class="fas fa-ship"></i> Морской Бой</h1>
        
        <!-- Меню -->
        <div id="game-menu">
            <button id="btn-create-game" class="btn-game">Создать игру</button>
            <button id="btn-join-game" class="btn-game">Найти игру</button>
            <div id="game-list" class="hidden">
                <h3>Доступные игры:</h3>
                <ul id="games-list-ul"></ul>
            </div>
        </div>

        <!-- Игровое поле -->
        <div id="game-area" class="hidden">
            <div class="status-bar" id="game-status">Ожидание соперника...</div>
            
            <h3>Ваше поле</h3>
            <div id="my-board" class="game-board"></div>
            
            <h3>Поле противника</h3>
            <div id="enemy-board" class="game-board"></div>
            
            <button id="btn-leave-game" class="btn-game" style="background:#e74c3c; margin-top:20px;">Выйти</button>
        </div>
    </main>

    <!-- Скрипты -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        /**
         * BATTLESHIP GAME LOGIC (Supabase Realtime)
         */
        
        let isInitialized = false;
        let currentGameId = null;
        let myChannel = null;
        let myShips = [];
        let enemyMoves = [];
        let myMoves = [];
        let isMyTurn = false;
        let gameStatus = 'waiting'; // waiting, playing, finished

        document.addEventListener('DOMContentLoaded', async () => {
            if (isInitialized) return;
            isInitialized = true;

            const user = firebase.auth().currentUser;
            if (!user) {
                alert('Сначала войдите в систему!');
                window.location.href = '../index.html';
                return;
            }

            // Кнопки меню
            document.getElementById('btn-create-game').addEventListener('click', createGame);
            document.getElementById('btn-join-game').addEventListener('click', toggleGameList);
            document.getElementById('btn-leave-game').addEventListener('click', leaveGame);

            // Загрузка списка игр (для присоединения)
            loadAvailableGames();
        });

        // 1. Создание игры
        async function createGame() {
            const user = firebase.auth().currentUser;
            const gameId = 'battle_' + Date.now();
            
            const newGame = {
                id: gameId,
                status: 'waiting',
                turn: null,
                winner: null,
                created_at: new Date(),
                data: {
                    players: { [user.uid]: { ready: false, ships: [] } },
                    moves: []
                }
            };

            const { error } = await supabase.from('battles').insert([newGame]);
            if (error) {
                console.error('Ошибка создания:', error);
                alert('Не удалось создать игру');
                return;
            }

            currentGameId = gameId;
            myShips = generateShips(); // Генерация кораблей (упрощено)
            
            // Обновляем свою запись с кораблями
            await updateGameShips(gameId, user.uid, myShips);

            initGameUI();
            subscribeToGame(gameId);
        }

        // 2. Присоединение к игре
        async function joinGame(gameId) {
            const user = firebase.auth().currentUser;
            const { data: game } = await supabase.from('battles').select('*').eq('id', gameId).single();
            
            if (!game || game.status !== 'waiting') return alert('Игра недоступна');

            // Добавляем второго игрока
            const updatedPlayers = { ...game.data.players, [user.uid]: { ready: false, ships: [] } };
            
            const { error } = await supabase.from('battles')
                .update({ 
                    status: 'playing',
                    turn: Object.keys(updatedPlayers)[0], // Ход первому
                    data: { ...game.data, players: updatedPlayers }
                })
                .eq('id', gameId);

            if (error) return alert('Ошибка входа');

            currentGameId = gameId;
            myShips = generateShips();
            await updateGameShips(gameId, user.uid, myShips);
            
            initGameUI();
            subscribeToGame(gameId);
        }

        // 3. Real-time подписка (Вместо onSnapshot)
        function subscribeToGame(gameId) {
            // Отписываемся от старых каналов если есть
            if (myChannel) supabase.removeChannel(myChannel);

            myChannel = supabase
                .channel(`battles:${gameId}`)
                .on('postgres_changes', 
                    { event: 'UPDATE', schema: 'public', table: 'battles', filter: `id=eq.${gameId}` }, 
                    (payload) => {
                        handleGameUpdate(payload.new);
                    }
                )
                .subscribe();
        }

        // Обработка обновлений из БД
        function handleGameUpdate(gameData) {
            const user = firebase.auth().currentUser;
            const data = gameData.data;
            
            // Обновляем статус
            gameStatus = gameData.status;
            document.getElementById('game-status').textContent = 
                gameStatus === 'waiting' ? 'Ожидание...' : 
                gameStatus === 'finished' ? `Игра окончена! Победитель: ${data.winner === user.uid ? 'ВЫ' : 'Соперник'}` :
                (data.turn === user.uid ? 'ВАШ ХОД!' : 'Ход соперника...');

            // Если появились ходы соперника - рисуем их
            if (data.moves) {
                renderEnemyMoves(data.moves);
            }

            if (gameStatus === 'finished') {
                setTimeout(() => {
                    if(myChannel) supabase.removeChannel(myChannel);
                    alert(gameData.winner === user.uid ? 'Победа!' : 'Поражение!');
                    location.reload();
                }, 2000);
            }
        }

        // 4. Логика хода
        function makeMove(x, y) {
            if (gameStatus !== 'playing') return;
            
            const user = firebase.auth().currentUser;
            const { data: game } = await supabase.from('battles').select('*').eq('id', currentGameId).single();
            
            if (game.turn !== user.uid) return alert('Не ваш ход!');

            // Проверка: не ходили ли сюда раньше
            // ... логика проверки ...

            const move = { x, y, player: user.uid, timestamp: Date.now() };
            
            // Добавляем ход в массив
            const newMoves = [...(game.data.moves || []), move];
            
            // Передача хода
            const players = Object.keys(game.data.players);
            const nextPlayer = players.find(p => p !== user.uid);

            supabase.from('battles').update({
                turn: nextPlayer,
                data: { ...game.data, moves: newMoves }
            }).eq('id', currentGameId);
        }

        // Утилиты (заглушки для примера)
        function generateShips() { return []; } // Тут логика расстановки
        function updateGameShips(gid, uid, ships) { /* обновление JSONB */ }
        function initGameUI() { 
            document.getElementById('game-menu').classList.add('hidden'); 
            document.getElementById('game-area').classList.remove('hidden'); 
        }
        function loadAvailableGames() { /* запрос к battles где status=waiting */ }
        function toggleGameList() { /* показать список */ }
        function leaveGame() { location.reload(); }
        function renderEnemyMoves(moves) { /* отрисовка попаданий */ }

    </script>
</body>
</html>
