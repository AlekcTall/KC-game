<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Морской бой – КЦ Игры</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root {
            --water-base: #a0c4e8;
            --water-dark: #7aa1c9;
            --ship-color: #4a5568;
            --ship-border: #2d3748;
            --hit-color: #ef4444;
            --miss-color: #ffffff;
            --sunk-color: #7f1d1d;
        }

        .battleship-game {
            max-width: 900px;
            margin: 2rem auto;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(10px);
        }

        .tabs {
            display: flex; gap: 0.5rem; margin-bottom: 1.5rem;
            border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem;
            justify-content: center;
        }
        .tab {
            background: none; border: none; padding: 0.6rem 1.2rem;
            font-size: 1rem; cursor: pointer; border-radius: 8px 8px 0 0;
            color: #64748b; font-weight: 600; transition: all 0.2s;
        }
        .tab.active { background: #3b82f6; color: white; }
        .tab:hover:not(.active) { background: #f1f5f9; color: #334155; }

        .boards-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            margin: 1.5rem 0;
        }
        .board-wrapper { text-align: center; }
        .board-wrapper h4 { margin-bottom: 0.5rem; color: #334155; font-size: 1.1rem; }

        /* Поле боя с эффектом воды */
        .board-grid {
            display: grid;
            grid-template-columns: repeat(10, 32px);
            grid-template-rows: repeat(10, 32px);
            gap: 1px;
            background: var(--water-dark);
            border: 3px solid #5d8aa8;
            border-radius: 8px;
            margin: 0.5rem auto;
            width: fit-content;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1), inset 0 0 20px rgba(0,0,0,0.1);
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.1) 0px, rgba(255,255,255,0.1) 2px, transparent 2px, transparent 8px);
        }

        .cell {
            width: 32px; height: 32px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: default;
            transition: background 0.15s, transform 0.1s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* КУРСОР-ПРИЦЕЛ И ПОДСВЕТКА ДЛЯ ПОЛЯ ПРОТИВНИКА */
        #enemy-board .cell:not(.disabled) {
            cursor: crosshair;
        }
        #enemy-board .cell:not(.disabled):hover {
            background: rgba(239, 68, 68, 0.25) !important;
            transform: scale(1.05);
            z-index: 2;
            border-color: rgba(239, 68, 68, 0.5);
        }

        /* Отрисовка корабля (палуба) */
        .cell.ship {
            background: linear-gradient(180deg, #4a5568 0%, #2d3748 100%);
            border: 1px solid #1a202c;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.2), 0 2px 4px rgba(0,0,0,0.3);
        }
        .cell.ship::before {
            content: '';
            position: absolute;
            top: 50%; left: 20%; right: 20%;
            height: 2px;
            background: rgba(255,255,255,0.3);
            transform: translateY(-50%);
            border-radius: 1px;
        }

        /* КРУПНЫЕ И ЧЕТКИЕ МАРКЕРЫ */
        .cell.hit::after {
            content: '✖';
            color: var(--hit-color);
            font-size: 32px; /* Крупный размер */
            font-weight: 900;
            line-height: 32px; /* Идеальное центрирование по высоте клетки */
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cell.miss::after, .cell.auto-miss::after {
            content: '●';
            color: var(--miss-color);
            font-size: 26px;
            line-height: 32px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
            animation: fadeDrop 0.4s ease-out;
        }
        .cell.auto-miss::after {
            font-size: 18px;
            opacity: 0.6;
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            70% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        @keyframes fadeDrop {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* УНИЧТОЖЕННЫЙ КОРАБЛЬ (очевидный и яркий) */
        .cell.sunk {
            background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%) !important;
            border: 2px solid #450a0a !important;
            animation: burn 1.5s infinite alternate;
            z-index: 1;
        }
        .cell.sunk::after {
            content: '✖';
            font-size: 26px;
            color: #fca5a5;
            line-height: 32px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        @keyframes burn {
            0% { box-shadow: inset 0 0 5px rgba(255,100,0,0.6); }
            100% { box-shadow: inset 0 0 15px rgba(255,50,0,0.9); }
        }

        /* Кнопки и UI */
        .btn {
            margin: 0.3rem; padding: 0.6rem 1.2rem;
            border: none; border-radius: 8px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white; font-weight: 600; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 2px 4px rgba(37, 99, 235, 0.3);
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 8px rgba(37, 99, 235, 0.4); }
        .btn:active { transform: translateY(1px); }
        .btn-cancel { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 2px 4px rgba(220, 38, 38, 0.3); }
        .btn:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; box-shadow: none; }

        .ship-selection {
            display: flex; gap: 0.5rem; align-items: center;
            justify-content: center; flex-wrap: wrap; margin: 1rem 0;
        }
        .ship-selection button {
            padding: 0.5rem 0.8rem; border: 2px solid #cbd5e1;
            border-radius: 8px; background: white; cursor: pointer;
            font-weight: 600; color: #475569; transition: all 0.2s;
        }
        .ship-selection button.active { 
            background: #3b82f6; color: white; border-color: #2563eb; 
            transform: scale(1.05);
        }

        .status-message { 
            font-weight: 700; margin: 1rem 0; font-size: 1.2rem; 
            color: #1e293b; min-height: 1.5rem;
        }
        .timer { 
            font-size: 1.1rem; font-weight: 700; margin: 0.5rem 0; 
            color: #059669; background: #d1fae5; display: inline-block;
            padding: 0.3rem 0.8rem; border-radius: 20px;
        }
        .timer.danger { color: #dc2626; background: #fee2e2; }

        .enemy-stats {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.6rem 1rem;
            margin: 0.8rem auto;
            display: inline-block;
            font-size: 0.95rem;
            color: #475569;
        }

        .lobby-panel {
            max-width: 550px; margin: 1rem auto; padding: 2rem;
            background: #f8fafc; border-radius: 16px;
            border: 1px solid #e2e8f0;
        }
        .open-games-table, .rating-table {
            width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem;
        }
        .open-games-table th, .open-games-table td,
        .rating-table th, .rating-table td {
            padding: 0.6rem 0.5rem; border-bottom: 1px solid #e2e8f0; text-align: left;
        }
        .open-games-table th, .rating-table th { background: #f1f5f9; color: #475569; font-weight: 600; }
        
        .back-link {
            display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 1.5rem;
            color: #64748b; text-decoration: none; font-weight: 600; transition: color 0.2s;
        }
        .back-link:hover { color: #3b82f6; }

        /* Адаптивность для мобильных */
        @media (max-width: 750px) {
            .board-grid {
                grid-template-columns: repeat(10, 28px);
                grid-template-rows: repeat(10, 28px);
            }
            .cell { width: 28px; height: 28px; }
            .cell.hit::after { font-size: 26px; line-height: 28px; }
            .cell.miss::after, .cell.auto-miss::after { line-height: 28px; }
            .cell.miss::after { font-size: 22px; }
            .cell.auto-miss::after { font-size: 14px; }
            .cell.sunk::after { font-size: 22px; line-height: 28px; }
        }
    </style>
</head>
<body>
<div class="battleship-game" id="game-container">
    <h2 style="margin-bottom: 0.5rem; color: #1e293b;">🚢 Морской бой</h2>
    <div class="tabs">
        <button class="tab active" data-tab="game">Игра</button>
        <button class="tab" data-tab="rating-pvp">Рейтинг PvP</button>
        <button class="tab" data-tab="rating-pve">Рейтинг PvE</button>
    </div>
    <div id="tab-content"></div>
    <a href="../games.html" class="back-link">← Вернуться к играм</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/firebase-auth.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/achievements.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/easter-eggs.js"></script>
<script src="../js/main.js"></script>

<script>
    (function() {
        const GRID_SIZE = 10;
        const ALL_SHIPS = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1];
        const SETUP_TIME = 120;
        const gameContainer = document.getElementById('tab-content');

        let currentUser = null, gameId = null, gameData = null;
        let myBoard = [], enemyBoard = [], myShips = [];
        let remainingShips = [...ALL_SHIPS];
        let selectedShipIndex = 0, orientation = 'horizontal';
        let setupTimer = null, setupSecondsLeft = SETUP_TIME;
        let isAI = false;
        let unsubscribeGame = null, unsubscribeOpenGames = null;
        let autoMisses = [];
        let gameEndProcessed = false;

        // Сериализация
        function serializeBoard(board) { return JSON.stringify(board); }
        function parseBoard(data) {
            if (!data) return Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
            try { return typeof data === 'string' ? JSON.parse(data) : data; }
            catch (e) { return Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0)); }
        }
        function serializeShips(ships) { return JSON.stringify(ships); }
        function parseShips(data) {
            if (!data) return [];
            try { return typeof data === 'string' ? JSON.parse(data) : data; }
            catch (e) { return []; }
        }

        auth.onAuthStateChanged(async user => {
            if (!user) {
                gameContainer.innerHTML = '<div class="lobby-panel"><p>Войдите, чтобы играть.</p><a href="../login.html?redirect=games/battleship.html" class="btn">Войти</a></div>';
                return;
            }
            currentUser = user;
            const resumed = await autoResumeGame();
            if (!resumed) switchTab('game');
        });

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                switchTab(tab.dataset.tab);
            });
        });

        function switchTab(tab) {
            if (tab === 'game') showLobby();
            else if (tab === 'rating-pvp') showRating('pvp');
            else if (tab === 'rating-pve') showRating('pve');
        }

        function showToast(msg, type = 'info') {
            if (typeof window.showToast === 'function') window.showToast(msg, type);
            else console.log(`[${type.toUpperCase()}] ${msg}`);
        }

        // ========== ЛОББИ ==========
        function showLobby() {
            if (unsubscribeOpenGames) unsubscribeOpenGames();
            if (unsubscribeGame) { unsubscribeGame(); unsubscribeGame = null; }
            gameId = null; gameData = null;
            clearSetupTimer();
            gameEndProcessed = false;

            // ИСПРАВЛЕН СЛОМАННЫЙ INPUT
            gameContainer.innerHTML = `
                <div class="lobby-panel">
                    <h3>Морской бой</h3>
                    <p style="color:#64748b; margin-bottom:1.5rem;">Сыграйте с коллегой или компьютером!</p>
                    <div style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap;">
                        <button class="btn" id="create-pvp-btn">👥 Играть с другом</button>
                        <button class="btn" id="play-ai-btn">🤖 Играть с компьютером</button>
                    </div>
                    <div style="margin-top:1.5rem; display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap;">
                        <input type="text" id="join-game-id" placeholder="ID игры" style="padding:0.6rem; width:100%; max-width:200px; border:1px solid #cbd5e1; border-radius:8px; outline:none; font-size:0.95rem;">
                        <button class="btn" id="join-game-btn">Присоединиться</button>
                    </div>
                    <h4 style="margin-top:1.5rem; color:#475569;">Открытые игры</h4>
                    <div id="open-games-list"><p style="color:#94a3b8;">Загрузка...</p></div>
                </div>
            `;

            document.getElementById('create-pvp-btn').addEventListener('click', () => createGame(false));
            document.getElementById('play-ai-btn').addEventListener('click', () => createGame(true));
            document.getElementById('join-game-btn').addEventListener('click', joinGame);

            unsubscribeOpenGames = db.collection('battles')
                .where('status', '==', 'waiting')
                .where('isAI', '==', false)
                .orderBy('createdAt', 'desc')
                .limit(10)
                .onSnapshot(snapshot => {
                    const list = document.getElementById('open-games-list');
                    if (!list) return;
                    if (snapshot.empty) { list.innerHTML = '<p style="color:#94a3b8;">Нет открытых игр.</p>'; return; }
                    let html = '<table class="open-games-table"><thead><tr><th>Создатель</th><th>Время</th><th></th></tr></thead><tbody>';
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const creator = data.players[Object.keys(data.players)[0]]?.username || 'Игрок';
                        const time = data.createdAt ? new Date(data.createdAt.seconds*1000).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}) : '';
                        html += `<tr><td>${creator}</td><td>${time}</td><td><button class="btn join-open-btn" style="padding:0.3rem 0.8rem; font-size:0.85rem;" data-id="${doc.id}">Войти</button></td></tr>`;
                    });
                    html += '</tbody></table>';
                    list.innerHTML = html;
                    list.querySelectorAll('.join-open-btn').forEach(b => b.addEventListener('click', () => joinGameById(b.dataset.id)));
                });
        }

        // ========== РЕЙТИНГИ ==========
        async function showRating(mode) {
            gameContainer.innerHTML = '<p style="padding:2rem; color:#64748b;">Загрузка рейтинга...</p>';
            try {
                const snap = await db.collection('users').get();
                const players = [];
                snap.forEach(doc => {
                    const d = doc.data();
                    if (d.role === 'admin') return;
                    const stats = d.battleshipStats || {};
                    const wins = mode === 'pvp' ? (stats.pvpWins || 0) : (stats.pveWins || 0);
                    if (wins > 0) players.push({ username: d.username || 'Аноним', wins });
                });
                players.sort((a,b) => b.wins - a.wins);
                let html = `<h3 style="margin-top:1rem; color:#334155;">${mode === 'pvp' ? '🏆 Лучшие адмиралы (PvP)' : '🤖 Лучшие адмиралы (PvE)'}</h3>`;
                if (players.length) {
                    html += '<table class="rating-table"><thead><tr><th>#</th><th>Игрок</th><th>Побед</th></tr></thead><tbody>';
                    players.slice(0, 15).forEach((p,i) => html += `<tr><td>${i+1}</td><td>${p.username}</td><td><strong>${p.wins}</strong></td></tr>`);
                    html += '</tbody></table>';
                } else html += '<p style="color:#94a3b8; margin-top:1rem;">Пока нет победителей.</p>';
                gameContainer.innerHTML = html;
            } catch (e) { gameContainer.innerHTML = '<p style="color:#ef4444; padding:2rem;">Ошибка загрузки рейтинга.</p>'; }
        }

        // ========== АВТО-ВОССТАНОВЛЕНИЕ ==========
        async function autoResumeGame() {
            if (!currentUser) return false;
            try {
                const snap = await db.collection('battles')
                    .where('participants', 'array-contains', currentUser.uid)
                    .get();
                if (snap.empty) return false;
                const activeGames = [];
                snap.forEach(doc => {
                    const data = doc.data();
                    if (data.status !== 'finished') activeGames.push({ id: doc.id, ...data });
                });
                if (activeGames.length === 0) return false;
                const game = activeGames[0];
                gameId = game.id;
                gameData = game;
                isAI = game.isAI || false;
                resetGameState();
                gameEndProcessed = false;
                subscribeToGame();
                return true;
            } catch (e) {
                console.error('Ошибка восстановления игры:', e);
                return false;
            }
        }

        // ========== СОЗДАНИЕ / ПРИСОЕДИНЕНИЕ ==========
        async function createGame(aiMode = false) {
            try {
                isAI = aiMode;
                gameEndProcessed = false;
                const docRef = await db.collection('battles').add({
                    status: 'waiting',
                    isAI: aiMode,
                    participants: [currentUser.uid],
                    players: {
                        [currentUser.uid]: { username: getCurrentUser()?.username || 'Игрок', shipsData: '', ready: false }
                    },
                    boards: { [currentUser.uid]: '' },
                    shots: {},
                    turn: null, winner: null, setupDeadline: null,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                gameId = docRef.id;
                if (aiMode) {
                    const aiShips = generateAIShips();
                    const aiBoard = buildBoardFromShips(aiShips);
                    await db.collection('battles').doc(gameId).update({
                        [`players.ai`]: { username: 'Компьютер', isAI: true, shipsData: serializeShips(aiShips), ready: true },
                        [`boards.ai`]: serializeBoard(aiBoard),
                        participants: firebase.firestore.FieldValue.arrayUnion('ai'),
                        status: 'setup',
                        setupDeadline: firebase.firestore.Timestamp.fromMillis(Date.now() + SETUP_TIME * 1000)
                    });
                }
                subscribeToGame();
                showToast(aiMode ? 'Игра с ИИ создана!' : 'Игра создана! ID: ' + gameId, 'success');
                resetGameState();
                if (aiMode) startSetupTimer();
            } catch (e) { showToast('Ошибка создания: ' + e.message, 'error'); }
        }

        async function joinGameById(id) {
            try {
                const doc = await db.collection('battles').doc(id).get();
                if (!doc.exists) { showToast('Игра не найдена', 'error'); return; }
                const data = doc.data();
                if (data.participants && data.participants.includes(currentUser.uid)) {
                    gameId = id;
                    isAI = data.isAI || false;
                    subscribeToGame();
                    resetGameState();
                    gameEndProcessed = false;
                    showToast('Игра восстановлена', 'info');
                    return;
                }
                if (data.status !== 'waiting') { showToast('Игра уже началась или завершена', 'error'); return; }
                if (Object.keys(data.players).length >= 2) { showToast('Игра заполнена', 'error'); return; }
                await db.collection('battles').doc(id).update({
                    [`players.${currentUser.uid}`]: { username: getCurrentUser()?.username || 'Игрок', shipsData: '', ready: false },
                    [`boards.${currentUser.uid}`]: '',
                    participants: firebase.firestore.FieldValue.arrayUnion(currentUser.uid),
                    status: 'setup',
                    setupDeadline: firebase.firestore.Timestamp.fromMillis(Date.now() + SETUP_TIME * 1000)
                });
                gameId = id;
                isAI = data.isAI || false;
                subscribeToGame();
                showToast('Вы присоединились!', 'success');
                resetGameState();
                startSetupTimer();
                gameEndProcessed = false;
            } catch (e) { showToast('Ошибка: ' + e.message, 'error'); }
        }

        function joinGame() {
            const id = document.getElementById('join-game-id')?.value.trim();
            if (id) joinGameById(id);
        }

        // ========== ИИ ==========
        function generateAIShips() {
            const ships = [];
            const board = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
            for (const size of ALL_SHIPS) {
                let placed = false;
                while (!placed) {
                    const orient = Math.random() < 0.5 ? 'h' : 'v';
                    const row = Math.floor(Math.random() * GRID_SIZE);
                    const col = Math.floor(Math.random() * GRID_SIZE);
                    if (canPlaceShipOnBoard(board, row, col, size, orient)) {
                        const ship = [];
                        for (let i = 0; i < size; i++) {
                            const r = orient === 'h' ? row : row + i;
                            const c = orient === 'h' ? col + i : col;
                            board[r][c] = 1;
                            ship.push({ row: r, col: c });
                        }
                        ships.push(ship);
                        placed = true;
                    }
                }
            }
            return ships;
        }

        function buildBoardFromShips(ships) {
            const board = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
            ships.flat().forEach(cell => board[cell.row][cell.col] = 1);
            return board;
        }

        function canPlaceShipOnBoard(board, row, col, size, orientation) {
            for (let i = 0; i < size; i++) {
                const r = orientation === 'h' ? row : row + i;
                const c = orientation === 'h' ? col + i : col;
                if (r < 0 || r >= GRID_SIZE || c < 0 || c >= GRID_SIZE || board[r][c] === 1) return false;
                for (let dr = -1; dr <= 1; dr++)
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && board[nr][nc] === 1) return false;
                    }
            }
            return true;
        }

        // ========== ОБЩИЕ ==========
        function resetGameState() {
            myBoard = []; enemyBoard = []; myShips = [];
            remainingShips = [...ALL_SHIPS];
            selectedShipIndex = 0; orientation = 'horizontal';
            autoMisses = [];
            clearSetupTimer();
        }

        function subscribeToGame() {
            if (unsubscribeGame) unsubscribeGame();
            unsubscribeGame = db.collection('battles').doc(gameId).onSnapshot(doc => {
                if (!doc.exists) { gameContainer.innerHTML = '<p>Игра не найдена.</p>'; return; }
                gameData = doc.data();
                updateGameState();
            });
        }

        function updateGameState() {
            if (!gameData) return;
            if (gameData.status === 'waiting') {
                renderWaitingScreen();
            } else if (gameData.status === 'setup') {
                if (!myBoard.length) myBoard = parseBoard(gameData.boards[currentUser.uid]);
                renderSetupScreen();
            } else if (gameData.status === 'active') {
                if (!myBoard.length) myBoard = parseBoard(gameData.boards[currentUser.uid]);
                if (!enemyBoard.length) initEnemyBoard();
                clearSetupTimer();
                restoreAutoMisses();
                renderBattleScreen();
            } else if (gameData.status === 'finished') {
                clearSetupTimer();
                renderFinishedScreen();
            }
        }

        function initEnemyBoard() {
            enemyBoard = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
        }

        // ========== ЭКРАН ОЖИДАНИЯ ==========
        function renderWaitingScreen() {
            gameContainer.innerHTML = `
                <div class="lobby-panel">
                    <h3>⏳ Ожидание соперника...</h3>
                    <p style="font-size:1.1rem; margin:1rem 0;">ID игры: <strong style="color:#3b82f6; font-size:1.3rem; letter-spacing:1px;">${gameId}</strong></p>
                    <p style="color:#64748b;">Поделитесь этим ID с коллегой, чтобы он присоединился.</p>
                    <button class="btn btn-cancel" id="cancel-game-btn" style="margin-top:1rem;">Отменить игру</button>
                </div>
            `;
            document.getElementById('cancel-game-btn').addEventListener('click', cancelGame);
        }

        // ========== ТАЙМЕР РАССТАНОВКИ ==========
        function startSetupTimer() {
            clearSetupTimer();
            setupSecondsLeft = SETUP_TIME;
            updateTimerDisplay();
            setupTimer = setInterval(() => {
                setupSecondsLeft--;
                updateTimerDisplay();
                if (setupSecondsLeft <= 0) {
                    clearSetupTimer();
                    if (!gameData?.players[currentUser.uid]?.ready) {
                        autoPlaceShips();
                        readyUp();
                    }
                }
            }, 1000);
        }

        function clearSetupTimer() { if (setupTimer) { clearInterval(setupTimer); setupTimer = null; } }

        function updateTimerDisplay() {
            const el = document.getElementById('setup-timer');
            if (el) {
                const mins = Math.floor(setupSecondsLeft / 60);
                const secs = setupSecondsLeft % 60;
                el.textContent = `⏱️ Осталось: ${mins}:${secs.toString().padStart(2,'0')}`;
                if (setupSecondsLeft < 30) el.classList.add('danger');
            }
        }

        function autoPlaceShips() {
            myBoard = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
            myShips = [];
            remainingShips = [...ALL_SHIPS];
            for (const size of ALL_SHIPS) {
                let placed = false;
                while (!placed) {
                    const orient = Math.random() < 0.5 ? 'horizontal' : 'vertical';
                    const row = Math.floor(Math.random() * GRID_SIZE);
                    const col = Math.floor(Math.random() * GRID_SIZE);
                    if (canPlaceShip(row, col, size, orient)) {
                        const ship = [];
                        for (let i = 0; i < size; i++) {
                            const r = orient === 'horizontal' ? row : row + i;
                            const c = orient === 'horizontal' ? col + i : col;
                            myBoard[r][c] = 1;
                            ship.push({ row: r, col: c });
                        }
                        myShips.push(ship);
                        remainingShips.shift();
                        placed = true;
                    }
                }
            }
        }

        async function readyUp() {
            const myUid = currentUser.uid;
            await db.collection('battles').doc(gameId).update({
                [`players.${myUid}.shipsData`]: serializeShips(myShips),
                [`players.${myUid}.ready`]: true,
                [`boards.${myUid}`]: serializeBoard(myBoard)
            });
            const doc = await db.collection('battles').doc(gameId).get();
            const data = doc.data();
            const allReady = Object.values(data.players).every(p => p.ready);
            if (allReady) {
                const uids = Object.keys(data.players);
                const randomFirst = uids[Math.floor(Math.random() * uids.length)];
                await db.collection('battles').doc(gameId).update({ status: 'active', turn: randomFirst });
            }
        }

        // ========== РАССТАНОВКА ==========
        function undoLastShip() {
            if (myShips.length === 0) return;
            const lastShip = myShips.pop();
            for (const cell of lastShip) {
                myBoard[cell.row][cell.col] = 0;
            }
            remainingShips.push(lastShip.length);
            remainingShips.sort((a,b) => b-a);
            if (selectedShipIndex >= remainingShips.length) {
                selectedShipIndex = remainingShips.length - 1;
            }
            renderSetupScreen();
            showToast('Последний корабль удалён', 'info');
        }

        function renderSetupScreen() {
            const myUid = currentUser.uid;
            const myData = gameData.players[myUid];
            const isReady = myData?.ready;

            if (isReady) {
                gameContainer.innerHTML = `<h3>✅ Расстановка завершена</h3><p style="color:#64748b;">Ожидание соперника...</p>${renderMyBoard(true)}`;
                return;
            }

            if (remainingShips.length === 0) {
                gameContainer.innerHTML = `<h3>✅ Все корабли расставлены</h3>${renderMyBoard(false)}
                <div style="margin-top:1rem; display:flex; gap:0.5rem; justify-content:center;">
                    <button class="btn" id="ready-btn">Готов к бою!</button>
                    <button class="btn btn-cancel" id="undo-last-btn">↩ Отменить последний</button>
                </div>`;
                document.getElementById('ready-btn').addEventListener('click', readyUp);
                document.getElementById('undo-last-btn').addEventListener('click', undoLastShip);
                return;
            }

            let shipHtml = '<div class="ship-selection"><span style="color:#475569; font-weight:600;">Выберите корабль:</span>';
            remainingShips.forEach((size, idx) => {
                shipHtml += `<button class="ship-btn ${idx === selectedShipIndex ? 'active' : ''}" data-index="${idx}">${'■'.repeat(size)} (${size})</button>`;
            });
            shipHtml += '</div>';

            let html = `
                <h3>🚢 Расставьте корабли</h3>
                <div class="timer" id="setup-timer"></div>
                ${shipHtml}
                <div style="margin:0.5rem 0;">
                    <button class="btn orientation-btn ${orientation === 'horizontal' ? 'active' : ''}" data-orientation="horizontal" style="background:#64748b;">↔ Горизонтально</button>
                    <button class="btn orientation-btn ${orientation === 'vertical' ? 'active' : ''}" data-orientation="vertical" style="background:#64748b;">↕ Вертикально</button>
                </div>
                <div class="board-wrapper"><h4>Ваше поле</h4>${renderMyBoard(false)}</div>
                <div style="margin-top:1rem; display:flex; gap:0.5rem; justify-content:center;">
                    <button class="btn" id="ready-btn" disabled>Готов</button>
                    <button class="btn btn-cancel" id="undo-last-btn" ${myShips.length === 0 ? 'disabled' : ''}>↩ Отменить</button>
                </div>
            `;
            gameContainer.innerHTML = html;
            startSetupTimer();

            document.querySelectorAll('.ship-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectedShipIndex = parseInt(btn.dataset.index);
                    document.querySelectorAll('.ship-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
            document.querySelectorAll('.orientation-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    orientation = btn.dataset.orientation;
                    document.querySelectorAll('.orientation-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
            document.querySelectorAll('#my-board .cell').forEach(cell => {
                cell.addEventListener('click', () => placeShip(parseInt(cell.dataset.row), parseInt(cell.dataset.col)));
            });
            const readyBtn = document.getElementById('ready-btn');
            readyBtn.disabled = myShips.length < ALL_SHIPS.length;
            readyBtn.addEventListener('click', readyUp);
            document.getElementById('undo-last-btn').addEventListener('click', undoLastShip);
        }

        function renderMyBoard(readOnly = false) {
            let grid = '';
            for (let r = 0; r < GRID_SIZE; r++)
                for (let c = 0; c < GRID_SIZE; c++)
                    grid += `<div class="cell ${myBoard[r][c] === 1 ? 'ship' : ''} ${readOnly ? 'disabled' : ''}" data-row="${r}" data-col="${c}"></div>`;
            return `<div class="board-grid" id="my-board">${grid}</div>`;
        }

        function placeShip(row, col) {
            if (remainingShips.length === 0) return;
            const size = remainingShips[selectedShipIndex];
            if (!canPlaceShip(row, col, size, orientation)) { showToast('Нельзя разместить здесь', 'error'); return; }
            const ship = [];
            for (let i = 0; i < size; i++) {
                const r = orientation === 'horizontal' ? row : row + i;
                const c = orientation === 'horizontal' ? col + i : col;
                myBoard[r][c] = 1;
                ship.push({ row: r, col: c });
            }
            myShips.push(ship);
            remainingShips.splice(selectedShipIndex, 1);
            if (remainingShips.length > 0) selectedShipIndex = 0;
            renderSetupScreen();
        }

        function canPlaceShip(row, col, size, orientation) {
            for (let i = 0; i < size; i++) {
                const r = orientation === 'horizontal' ? row : row + i;
                const c = orientation === 'horizontal' ? col + i : col;
                if (r < 0 || r >= GRID_SIZE || c < 0 || c >= GRID_SIZE || myBoard[r][c] === 1) return false;
                for (let dr = -1; dr <= 1; dr++)
                    for (let dc = -1; dc <= 1; dc++)
                        if (r+dr >=0 && r+dr < GRID_SIZE && c+dc >=0 && c+dc < GRID_SIZE && myBoard[r+dr][c+dc] === 1) return false;
            }
            return true;
        }

        // ========== БОЙ ==========
        function getOpponentUid() {
            return Object.keys(gameData.players).find(uid => uid !== currentUser.uid) || 'ai';
        }

        function getRemainingShipsInfo() {
            const opponentUid = getOpponentUid();
            const ships = parseShips(gameData.players[opponentUid].shipsData);
            const shots = gameData.shots[currentUser.uid] || [];
            const aliveShips = ships.filter(ship => !ship.every(cell => shots.some(s => s.row === cell.row && s.col === cell.col && s.hit)));
            const aliveCells = aliveShips.flat().length;
            return { aliveShips: aliveShips.length, aliveCells };
        }

        function getSunkShipCells(ships, shots) {
            const sunkCells = new Set();
            const hitShots = shots.filter(s => s.hit);
            for (const ship of ships) {
                const isSunk = ship.every(cell => hitShots.some(s => s.row === cell.row && s.col === cell.col));
                if (isSunk) {
                    ship.forEach(cell => sunkCells.add(`${cell.row},${cell.col}`));
                }
            }
            return sunkCells;
        }

        function restoreAutoMisses() {
            const opponentUid = getOpponentUid();
            const ships = parseShips(gameData.players[opponentUid].shipsData);
            const shots = gameData.shots[currentUser.uid] || [];
            autoMisses = [];
            for (const ship of ships) {
                if (ship.every(cell => shots.some(s => s.row === cell.row && s.col === cell.col && s.hit))) {
                    const occupied = new Set(ship.map(c => `${c.row},${c.col}`));
                    for (const cell of ship) {
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                const nr = cell.row + dr, nc = cell.col + dc;
                                if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && !occupied.has(`${nr},${nc}`)) {
                                    if (enemyBoard[nr][nc] === 0) {
                                        enemyBoard[nr][nc] = -2;
                                        autoMisses.push({ row: nr, col: nc });
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        function renderBattleScreen() {
            const myUid = currentUser.uid;
            const opponentUid = getOpponentUid();
            const myTurn = gameData.turn === myUid;
            const shots = gameData.shots || {};
            const myShots = shots[myUid] || [];
            const opponentShots = shots[opponentUid] || [];

            for (const shot of myShots) {
                enemyBoard[shot.row][shot.col] = shot.hit ? 2 : -1;
            }
            for (const miss of autoMisses) {
                if (enemyBoard[miss.row][miss.col] === 0) enemyBoard[miss.row][miss.col] = -2;
            }

            const info = getRemainingShipsInfo();

            gameContainer.innerHTML = `
                <div class="boards-container">
                    <div class="board-wrapper">
                        <h4>🛡️ Ваше поле</h4>
                        ${renderMyBoardForBattle(opponentShots)}
                    </div>
                    <div class="board-wrapper">
                        <h4>🎯 Поле соперника</h4>
                        ${renderEnemyBoardForBattle(myTurn)}
                        <div class="enemy-stats">
                            🚢 Кораблей: <strong>${info.aliveShips}</strong> | 
                            ⬜ Клеток: <strong>${info.aliveCells}</strong>
                        </div>
                    </div>
                </div>
                <p class="status-message">${myTurn ? '🟢 Ваш ход!' : '🔴 Ход соперника...'}</p>
                <button class="btn btn-cancel" id="surrender-btn">🏳️ Сдаться</button>
            `;

            if (myTurn) {
                document.querySelectorAll('#enemy-board .cell').forEach(cell => {
                    cell.addEventListener('click', () => makeShot(parseInt(cell.dataset.row), parseInt(cell.dataset.col)));
                });
            }

            document.getElementById('surrender-btn').addEventListener('click', surrender);

            if (gameData.turn === 'ai' && gameData.status === 'active') setTimeout(aiMove, 1500);
        }

        function renderMyBoardForBattle(opponentShots) {
            let grid = '';
            for (let r = 0; r < GRID_SIZE; r++)
                for (let c = 0; c < GRID_SIZE; c++) {
                    let cls = myBoard[r][c] === 1 ? 'ship' : '';
                    const shot = opponentShots.find(s => s.row === r && s.col === c);
                    if (shot) cls += shot.hit ? ' hit' : ' miss';
                    grid += `<div class="cell ${cls} disabled" data-row="${r}" data-col="${c}"></div>`;
                }
            return `<div class="board-grid" id="my-board">${grid}</div>`;
        }

        function renderEnemyBoardForBattle(myTurn) {
            const opponentUid = getOpponentUid();
            const oppShips = parseShips(gameData.players[opponentUid].shipsData);
            const myShots = gameData.shots[currentUser.uid] || [];
            const sunkCells = getSunkShipCells(oppShips, myShots);

            let grid = '';
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    let cls = '';
                    const isSunk = sunkCells.has(`${r},${c}`);
                    
                    if (isSunk) cls = 'sunk';
                    else if (enemyBoard[r][c] === 2) cls = 'hit';
                    else if (enemyBoard[r][c] === -1) cls = 'miss';
                    else if (enemyBoard[r][c] === -2) cls = 'auto-miss';
                    
                    const disabled = !myTurn || enemyBoard[r][c] !== 0 ? 'disabled' : '';
                    grid += `<div class="cell ${cls} ${disabled}" data-row="${r}" data-col="${c}"></div>`;
                }
            }
            return `<div class="board-grid" id="enemy-board">${grid}</div>`;
        }

        async function makeShot(row, col) {
            if (gameData.turn !== currentUser.uid) return;
            if (enemyBoard[row][col] !== 0) { showToast('Сюда уже стреляли', 'info'); return; }

            const opponentUid = getOpponentUid();
            const oppBoard = parseBoard(gameData.boards[opponentUid]);
            const hit = oppBoard[row][col] === 1;
            const shot = { row, col, hit };
            const shots = gameData.shots || {};
            const myShots = [...(shots[currentUser.uid] || []), shot];
            const oppShips = parseShips(gameData.players[opponentUid].shipsData);

            const sunkShip = oppShips.find(ship => 
                ship.some(cell => cell.row === row && cell.col === col) &&
                ship.every(cell => myShots.some(s => s.row === cell.row && s.col === cell.col && s.hit))
            );

            let toastMsg = hit ? '🎯 Ранен!' : '💧 Мимо!';
            if (sunkShip) {
                toastMsg = '🔥 Убит!';
                addAutoMissesForShip(sunkShip);
                if (sunkShip.length === 4) {
                    await db.collection('users').doc(currentUser.uid).update({
                        'battleshipStats.sunk4Deck': true
                    }).catch(console.error);
                    if (typeof checkAndAwardAchievements === 'function') {
                        checkAndAwardAchievements();
                    }
                }
            }
            showToast(toastMsg, hit ? 'success' : 'info');

            const allSunk = checkAllShipsSunk(oppShips, myShots);
            const updateData = {
                [`shots.${currentUser.uid}`]: myShots,
                turn: allSunk ? null : opponentUid,
                status: allSunk ? 'finished' : 'active',
                winner: allSunk ? currentUser.uid : null
            };

            await db.collection('battles').doc(gameId).update(updateData);

            if (allSunk) {
                gameData = { ...gameData, ...updateData, status: 'finished', winner: currentUser.uid };
                await handleGameEnd(currentUser.uid);
                renderFinishedScreen();
            }
        }

        function addAutoMissesForShip(ship) {
            const occupied = new Set(ship.map(c => `${c.row},${c.col}`));
            for (const cell of ship) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = cell.row + dr, nc = cell.col + dc;
                        if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && !occupied.has(`${nr},${nc}`)) {
                            if (enemyBoard[nr][nc] === 0) {
                                enemyBoard[nr][nc] = -2;
                                autoMisses.push({ row: nr, col: nc });
                            }
                        }
                    }
                }
            }
        }

        async function aiMove() {
            const myUid = currentUser.uid;
            const shots = gameData.shots?.ai || [];
            const available = [];
            for (let r = 0; r < GRID_SIZE; r++)
                for (let c = 0; c < GRID_SIZE; c++)
                    if (!shots.some(s => s.row === r && s.col === c)) available.push({row: r, col: c});
            if (!available.length) return;
            const {row, col} = available[Math.floor(Math.random() * available.length)];
            const myBoardData = parseBoard(gameData.boards[myUid]);
            const hit = myBoardData[row][col] === 1;
            const newShots = [...shots, { row, col, hit }];
            const myShipsData = parseShips(gameData.players[myUid].shipsData);
            const allSunk = checkAllShipsSunk(myShipsData, newShots);

            const updateData = {
                [`shots.ai`]: newShots,
                turn: allSunk ? null : myUid,
                status: allSunk ? 'finished' : 'active',
                winner: allSunk ? 'ai' : null
            };

            await db.collection('battles').doc(gameId).update(updateData);

            if (allSunk) {
                gameData = { ...gameData, ...updateData, status: 'finished', winner: 'ai' };
                await handleGameEnd('ai');
                renderFinishedScreen();
            }
        }

        function checkAllShipsSunk(ships, shots) {
            const allCells = ships.flat();
            const hitShots = shots.filter(s => s.hit).map(s => ({ row: s.row, col: s.col }));
            return allCells.every(cell => hitShots.some(h => h.row === cell.row && h.col === cell.col));
        }

        async function handleGameEnd(winnerUid) {
            if (gameEndProcessed) return;
            gameEndProcessed = true;

            const myUid = currentUser.uid;
            const isWin = winnerUid === myUid;
            const mode = isAI ? 'pve' : 'pvp';

            const userRef = db.collection('users').doc(myUid);
            const userDoc = await userRef.get();
            const userData = userDoc.data() || {};
            const stats = userData.battleshipStats || {};

            let newStreak = stats.currentWinStreak || 0;
            let bestStreak = stats.bestWinStreak || 0;
            if (isWin) {
                newStreak++;
                if (newStreak > bestStreak) bestStreak = newStreak;
            } else {
                newStreak = 0;
            }

            const myShots = gameData.shots[currentUser.uid] || [];
            const sniper = isWin && myShots.length <= 30;
            const opponentUid = getOpponentUid();
            const opponentShots = gameData.shots[opponentUid] || [];
            const unsinkable = isWin && opponentShots.length > 0 && !opponentShots.some(s => s.hit);

            const updateData = {
                [`battleshipStats.${mode}Wins`]: firebase.firestore.FieldValue.increment(isWin ? 1 : 0),
                [`battleshipStats.${mode}Losses`]: firebase.firestore.FieldValue.increment(isWin ? 0 : 1),
                'battleshipStats.currentWinStreak': newStreak,
                'battleshipStats.bestWinStreak': bestStreak
            };

            if (sniper) updateData['battleshipStats.sniperGame'] = true;
            if (unsinkable) updateData['battleshipStats.unsinkableGame'] = true;

            await userRef.update(updateData);

            if (isWin) {
                if (typeof addPointsToCurrentUser === 'function') await addPointsToCurrentUser(10, 'battleship');
                const balance = (userData.lokoin_balance || 0) + 3;
                await userRef.update({ lokoin_balance: balance });
                showToast('🎉 Победа! +10 баллов, +3 локоина', 'success');
            }

            if (typeof checkAndAwardAchievements === 'function') await checkAndAwardAchievements();

            clearSetupTimer();
            if (unsubscribeGame) {
                unsubscribeGame();
                unsubscribeGame = null;
            }
            gameId = null;
        }

        function renderFinishedScreen() {
            const winner = gameData.winner === currentUser.uid ? 'Вы' : (gameData.players[gameData.winner]?.username || 'Соперник');
            gameContainer.innerHTML = `
                <div class="lobby-panel" style="animation: popIn 0.5s ease;">
                    <h3 style="font-size:2rem; margin-bottom:1rem;">${gameData.winner === currentUser.uid ? '🎉 Победа!' : '😞 Поражение'}</h3>
                    <p style="font-size:1.2rem; margin-bottom:1.5rem;">Победитель: <strong style="color:#3b82f6;">${winner}</strong></p>
                    <button class="btn" id="new-game-btn" style="font-size:1.1rem; padding:0.8rem 2rem;">🔄 Новая игра</button>
                </div>
            `;
            document.getElementById('new-game-btn').addEventListener('click', () => {
                if (unsubscribeGame) { unsubscribeGame(); unsubscribeGame = null; }
                gameId = null; gameData = null;
                clearSetupTimer();
                showLobby();
            });
        }

        // ========== ВЫХОД ИЗ ИГРЫ ==========
        async function cancelGame() {
            if (!gameId) return;
            await db.collection('battles').doc(gameId).update({
                status: 'finished',
                winner: 'cancelled'
            });
            clearSetupTimer();
            if (unsubscribeGame) { unsubscribeGame(); unsubscribeGame = null; }
            gameId = null; gameData = null;
            showLobby();
            showToast('Игра отменена', 'info');
        }

        async function surrender() {
            if (!gameId || !gameData) return;
            const opponentUid = getOpponentUid();
            await db.collection('battles').doc(gameId).update({
                status: 'finished',
                winner: opponentUid,
                surrendered: currentUser.uid
            });
            clearSetupTimer();
            await handleGameEnd(opponentUid);
        }

        window.addEventListener('beforeunload', () => {
            if (unsubscribeGame) unsubscribeGame();
            if (unsubscribeOpenGames) unsubscribeOpenGames();
            clearSetupTimer();
            if (gameId && gameData && gameData.status === 'active' && auth.currentUser) {
                const opponentUid = getOpponentUid();
                db.collection('battles').doc(gameId).update({
                    status: 'finished',
                    winner: opponentUid,
                    abandoned: true,
                    abandonedBy: auth.currentUser.uid
                }).catch(() => {});
                const mode = isAI ? 'pve' : 'pvp';
                db.collection('users').doc(auth.currentUser.uid).update({
                    [`battleshipStats.${mode}Losses`]: firebase.firestore.FieldValue.increment(1)
                }).catch(() => {});
                db.collection('users').doc(auth.currentUser.uid).update({
                    'battleshipStats.currentWinStreak': 0
                }).catch(() => {});
            }
        });
    })();
</script>
</body>
