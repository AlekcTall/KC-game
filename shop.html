<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин | KC Games</title>
    
    <!-- Стили -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/shop.css">
    
    <!-- Иконки -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-theme">

    <!-- Навигация -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">KC Games</a>
            <div class="nav-links">
                <a href="index.html">Главная</a>
                <a href="games.html">Игры</a>
                <a href="shop.html" class="active">Магазин</a>
                <a href="profile.html">Профиль</a>
                <a href="leaderboard.html">Рейтинг</a>
            </div>
            <div class="user-info">
                <span id="nav-balance" class="balance-badge">0 💰</span>
                <span id="nav-points" class="points-badge">0 XP</span>
                <button id="logout-btn" class="btn-logout"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="container shop-container">
        <header class="page-header">
            <h1><i class="fas fa-store"></i> Магазин предметов</h1>
            <p>Покупайте улучшения, аватарки и валюту за Локоины</p>
        </header>

        <!-- Фильтры -->
        <div class="shop-filters">
            <button class="filter-btn active" data-category="all">Все</button>
            <button class="filter-btn" data-category="effect">Эффекты</button>
            <button class="filter-btn" data-category="avatar">Аватарки</button>
            <button class="filter-btn" data-category="currency">Валюта</button>
            <button class="filter-btn" data-category="background">Фоны</button>
            <button class="filter-btn" data-category="service">Услуги</button>
        </div>

        <!-- Сетка товаров -->
        <div id="shop-items-grid" class="items-grid">
            <!-- Товары загружаются через JS -->
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i> Загрузка товаров...
            </div>
        </div>
    </main>

    <!-- Модальное окно покупки -->
    <div id="purchase-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modal-title">Название товара</h2>
            <div class="modal-body">
                <img id="modal-icon" src="" alt="Icon" class="modal-icon">
                <p id="modal-description">Описание товара</p>
                <div class="modal-price">Цена: <span id="modal-price">0</span> 💰</div>
                
                <div id="purchase-form">
                    <button id="confirm-purchase-btn" class="btn-buy">Купить</button>
                </div>
                <div id="purchase-status" class="status-message"></div>
            </div>
        </div>
    </div>

    <!-- Скрипты -->
    <!-- 1. Firebase (только Auth) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <!-- 2. Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>

    <!-- 3. Логика магазина -->
    <script src="js/shop.js"></script>
    
    <!-- 4. Общая логика (Auth UI) -->
    <script src="js/auth.js"></script>

</body>
</html>
